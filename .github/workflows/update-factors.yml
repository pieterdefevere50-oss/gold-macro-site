name: Update gold macro factors

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours, all day, every day — runs with nobody watching
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch news and regenerate factors.json
        run: node scripts/update_factors.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "gold-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factors.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update gold macro factors [skip ci]"
            git push
          fi
